[package]
name = "immichsync"
version = "0.1.0"
edition = "2024"
description = "Nightly photo backup CLI for Immich"
license = "GPL-3.0-or-later"
repository = "https://github.com/i-machine-things/ImmichSync"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
sha1 = "0.10"
hex = "0.4"
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
directories = "5"
rpassword = "7"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
strip = true

[package.metadata.deb]
maintainer = "i-machine-things <allann2020@gmail.com>"
copyright = "2026, i-machine-things"
license-file = ["LICENSE", "0"]
extended-description = """\
Nightly photo backup CLI for Immich. Uploads new/changed files from a local \
photos directory to a self-hosted Immich server, using checksum-based dedup \
(via Immich's bulk-upload-check API) to skip files that are already there."""
depends = "$auto"
section = "utils"
priority = "optional"
maintainer-scripts = "debian"
assets = [
    ["target/release/immichsync", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/immichsync/README.md", "644"],
]
